<header class="site-header" id="header">
    <div class="container nav-container">
      <a href="#hero" class="brand-link">
        <div class="brand-avatar" aria-hidden="true">M</div>
        <span>Miguel Aranguren</span>
        <span class="brand-title-sub" data-i18n="nav.brandSub">/ Fullstack</span>
      </a>

      <!-- Enlaces de navegación desktop y móvil -->
      <nav aria-label="Navegación principal">
        <ul class="nav-links" id="nav-links">
          <li><a href="#sobre-mi" class="nav-item-link" data-i18n="nav.about">Sobre Mí</a></li>
          <li><a href="#proyectos" class="nav-item-link" data-i18n="nav.projects">Proyectos</a></li>
          <li><a href="#skills" class="nav-item-link" data-i18n="nav.skills">Habilidades</a></li>
          <li><a href="#experiencia" class="nav-item-link" data-i18n="nav.experience">Trayectoria</a></li>
          <li><a href="#contacto" class="nav-item-link" data-i18n="nav.contact">Contacto</a></li>
          <li class="mobile-only-cta"><a href="#contacto" class="btn-primary"
              style="justify-content: center; width: 100%; margin-top: 0.5rem;" data-i18n="nav.cta">Hablemos</a></li>
        </ul>
      </nav>

      <!-- Acciones: Idioma + Tema + CTA + Menú móvil -->
      <div class="nav-actions">
        <button id="lang-toggle" class="lang-toggle-btn" aria-label="Switch to English"
          title="Cambiar idioma / Switch language">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span class="lang-code" id="lang-code-indicator">EN</span>
        </button>

        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Cambiar tema de color"
          title="Alternar modo claro/oscuro">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>

        <a href="#contacto" class="nav-cta-btn" id="nav-cta">
          <span data-i18n="nav.cta">Hablemos</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>

        <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Abrir menú de navegación"
          data-i18n-aria-label="nav.menuAria" aria-expanded="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>
